<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éditeur & Prévisualisation HTML avec ChatGPT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 15px;
            gap: 15px;
        }

        .section {
            display: flex;
            flex-direction: column;
            min-height: 200px;
            flex: 1;
            background: #ffffff;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Mode plein écran */
        .section.fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999 !important;
            border-radius: 0 !important;
            border: none !important;
            box-shadow: none !important;
        }

        .toolbar {
            background: #eef2f7;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #dcdfe6;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
        }

        .toolbar h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #4a5568;
            pointer-events: none;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #2b6cb0;
        }

        button.btn-clear {
            background-color: #e53e3e;
        }

        button.btn-clear:hover {
            background-color: #c53030;
        }

        button.btn-paste {
            background-color: #38a169;
        }

        button.btn-paste:hover {
            background-color: #2f855a;
        }

        button.btn-toggle-fs {
            background-color: #4a5568;
        }

        button.btn-toggle-fs:hover {
            background-color: #2d3748;
        }

        /* Style spécifique pour le bouton d'envoi vers ChatGPT */
        .btn-chatgpt {
            background-color: #10a37f;
            color: white;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            align-self: flex-start;
            box-shadow: 0 2px 6px rgba(16, 163, 127, 0.3);
        }

        .btn-chatgpt:hover {
            background-color: #0e8e6d;
        }

        button:active {
            transform: scale(0.98);
        }

        textarea {
            width: 100%;
            height: 100%;
            min-height: 150px;
            border: none;
            padding: 15px;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            background: #fafafa;
        }

        .wysiwyg {
            width: 100%;
            height: 100%;
            min-height: 150px;
            padding: 15px;
            overflow-y: auto;
            outline: none;
            background: #ffffff;
        }

        /* Troisième fenêtre visuelle : Texte entièrement noir, poids normal, pas d'italique */
        .wysiwyg-monochrome, 
        .wysiwyg-monochrome * {
            color: #000000 !important;
            font-weight: normal !important;
            font-style: normal !important;
            text-decoration: none !important;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2f855a;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 10000;
        }

        .toast.show {
            opacity: 1;
        }

        #renderHost {
            position: absolute;
            width: 0;
            height: 0;
            border: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <iframe id="renderHost"></iframe>

    <!-- NOUVELLE FENÊTRE 1 : Instructions Persistantes (LocalStorage) -->
    <div class="section" id="sectionPrompt">
        <div class="toolbar" id="tbPrompt">
            <h2>1. Instructions / Prompt (Sauvegarde automatique)</h2>
            <div class="button-group">
                <button class="btn-clear" onclick="clearPromptText()">Vider</button>
                <button class="btn-paste" onclick="pasteToPrompt()">Coller</button>
                <button class="btn-toggle-fs" onclick="toggleFullscreen('sectionPrompt')">Plein écran</button>
            </div>
        </div>
        <textarea id="promptText" placeholder="Entrez vos instructions permanentes ici (ex: Traduis ce texte en anglais...)..."></textarea>
    </div>

    <!-- NOUVELLE FENÊTRE 2 : Contexte / Données à coller -->
    <div class="section" id="sectionContext">
        <div class="toolbar" id="tbContext">
            <h2>2. Données / Contexte</h2>
            <div class="button-group">
                <button class="btn-clear" onclick="clearContextText()">Vider</button>
                <button class="btn-paste" onclick="pasteToContext()">Coller</button>
                <button class="btn-toggle-fs" onclick="toggleFullscreen('sectionContext')">Plein écran</button>
            </div>
        </div>
        <textarea id="contextText" placeholder="Collez ici le contenu ou les données à traiter..."></textarea>
    </div>

    <!-- BOUTON D'ENVOI VERS CHATGPT -->
    <button class="btn-chatgpt" onclick="sendToChatGPT()">Envoyer vers ChatGPT</button>

    <hr style="border: 0; border-top: 1px solid #dcdfe6; margin: 10px 0;">

    <!-- FENÊTRE 3 : Éditeur de code HTML (Ancienne Fenêtre 1) -->
    <div class="section" id="section1">
        <div class="toolbar" id="tb1">
            <h2>Source HTML (Éditable)</h2>
            <div class="button-group">
                <button class="btn-clear" onclick="clearSourceHTML()">Vider</button>
                <button class="btn-paste" onclick="pasteToSourceHTML()">Coller</button>
                <button class="btn-toggle-fs" onclick="toggleFullscreen('section1')">Plein écran</button>
                <button onclick="copySourceHTML()">Copier le code HTML</button>
            </div>
        </div>
        <textarea id="htmlSource" placeholder="Saisissez ou collez votre code HTML ici..."></textarea>
    </div>

    <!-- FENÊTRE 4 : Aperçu visuel éditable (WYSIWYG) -->
    <div class="section" id="section2">
        <div class="toolbar" id="tb2">
            <h2>Aperçu Visuel (Éditable)</h2>
            <div class="button-group">
                <button class="btn-clear" onclick="clearVisualHTML()">Vider</button>
                <button class="btn-toggle-fs" onclick="toggleFullscreen('section2')">Plein écran</button>
                <button onclick="copyRichText()">Copier le texte rendu (Riche)</button>
            </div>
        </div>
        <div id="htmlVisual" class="wysiwyg" contenteditable="true"></div>
    </div>

    <!-- FENÊTRE 5 : Aperçu Monochrome avec texte coloré entre doubles crochets -->
    <div class="section" id="section3">
        <div class="toolbar" id="tb3">
            <h2>Aperçu Monochrome (Texte coloré entre doubles crochets)</h2>
            <div class="button-group">
                <button class="btn-clear" onclick="clearProcessedHTML()">Vider</button>
                <button class="btn-toggle-fs" onclick="toggleFullscreen('section3')">Plein écran</button>
                <button onclick="copyProcessedRichText()">Copier le texte rendu (Riche)</button>
            </div>
        </div>
        <div id="htmlProcessed" class="wysiwyg wysiwyg-monochrome" contenteditable="true"></div>
    </div>

    <div id="toast" class="toast">Action effectuée avec succès !</div>

    <script>
        const promptText = document.getElementById('promptText');
        const contextText = document.getElementById('contextText');
        const htmlSource = document.getElementById('htmlSource');
        const htmlVisual = document.getElementById('htmlVisual');
        const htmlProcessed = document.getElementById('htmlProcessed');
        const renderHost = document.getElementById('renderHost');
        const toast = document.getElementById('toast');

        // -------------------------------------------------------------
        // PERSISTENCE LOCALSTORAGE (FENÊTRE 1)
        // -------------------------------------------------------------

        const LOCAL_STORAGE_KEY = 'app_persistent_prompt';

        // Chargement initial du texte sauvegardé
        const savedPrompt = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (savedPrompt !== null) {
            promptText.value = savedPrompt;
        }

        // Sauvegarde à chaque modification
        promptText.addEventListener('input', () => {
            localStorage.setItem(LOCAL_STORAGE_KEY, promptText.value);
        });

        function clearPromptText() {
            promptText.value = '';
            localStorage.removeItem(LOCAL_STORAGE_KEY);
            showToast("Instructions vidées !");
        }

        async function pasteToPrompt() {
            try {
                const text = await navigator.clipboard.readText();
                if (text !== undefined) {
                    promptText.value = text;
                    localStorage.setItem(LOCAL_STORAGE_KEY, text);
                    showToast("Instructions collées !");
                }
            } catch (err) {
                showToast("Accès au presse-papier non autorisé");
            }
        }

        function clearContextText() {
            contextText.value = '';
            showToast("Contexte vidé !");
        }

        async function pasteToContext() {
            try {
                const text = await navigator.clipboard.readText();
                if (text !== undefined) {
                    contextText.value = text;
                    showToast("Contexte collé !");
                }
            } catch (err) {
                showToast("Accès au presse-papier non autorisé");
            }
        }

        // -------------------------------------------------------------
        // ENVOI VERS CHATGPT
        // -------------------------------------------------------------

        function sendToChatGPT() {
            const part1 = promptText.value.trim();
            const part2 = contextText.value.trim();

            if (!part1 && !part2) {
                showToast("Les fenêtres sont vides !");
                return;
            }

            // Concaténation : Contenu 1 + Saut de ligne + Contenu 2
            const combinedQuery = part1 + (part1 && part2 ? "\n" : "") + part2;
            const encodedQuery = encodeURIComponent(combinedQuery);
            
            // Ouverture de ChatGPT avec le paramètre 'q'
            const targetUrl = `https://chatgpt.com/?q=${encodedQuery}`;
            window.open(targetUrl, '_blank');
        }

        // Exemple de contenu initial pour la partie HTML
        const initialContent = `<h3>Titre d'exemple</h3>\n<p>Ceci est un texte en <strong>gras</strong> et en <span style="color: red;">rouge</span>.</p>\n<ul>\n  <li>Élément 1</li>\n  <li>Élément en <font color="blue">bleu</font></li>\n</ul>`;
        htmlSource.value = initialContent;
        htmlVisual.innerHTML = initialContent;
        updateProcessedView();

        // -------------------------------------------------------------
        // COLLAGE DIRECT ET SYNCHRONISATION HTML
        // -------------------------------------------------------------

        async function pasteToSourceHTML() {
            try {
                const text = await navigator.clipboard.readText();
                if (text !== undefined) {
                    htmlSource.value = text;
                    htmlVisual.innerHTML = text;
                    updateProcessedView();
                    showToast("Code HTML collé !");
                }
            } catch (err) {
                showToast("Accès au presse-papier non autorisé");
            }
        }

        htmlSource.addEventListener('paste', () => {
            setTimeout(() => {
                htmlVisual.innerHTML = htmlSource.value;
                updateProcessedView();
                showToast("Code HTML collé !");
            }, 50);
        });

        // -------------------------------------------------------------
        // GESTION DU PLEIN ÉCRAN & DOUBLE-TAP (CIBLÉ SUR TOUTES LES TOOLBARS)
        // -------------------------------------------------------------
        
        function toggleFullscreen(sectionId) {
            const targetSection = document.getElementById(sectionId);
            const isFullscreen = targetSection.classList.contains('fullscreen');
            
            document.querySelectorAll('.section').forEach(sec => {
                sec.classList.remove('fullscreen');
                const btn = sec.querySelector('.btn-toggle-fs');
                if (btn) btn.textContent = 'Plein écran';
            });

            if (!isFullscreen) {
                targetSection.classList.add('fullscreen');
                const btn = targetSection.querySelector('.btn-toggle-fs');
                if (btn) btn.textContent = 'Réduire';
                showToast("Mode plein écran activé");
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.section').forEach(sec => {
                    sec.classList.remove('fullscreen');
                    const btn = sec.querySelector('.btn-toggle-fs');
                    if (btn) btn.textContent = 'Plein écran';
                });
            }
        });

        ['sectionPrompt', 'sectionContext', 'section1', 'section2', 'section3'].forEach(secId => {
            const section = document.getElementById(secId);
            if (!section) return;
            const toolbar = section.querySelector('.toolbar');
            let lastTapTime = 0;

            toolbar.addEventListener('dblclick', (e) => {
                if (e.target.tagName !== 'BUTTON') {
                    toggleFullscreen(secId);
                }
            });

            toolbar.addEventListener('touchend', (e) => {
                if (e.target.tagName === 'BUTTON') return;

                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;

                if (tapLength < 300 && tapLength > 0) {
                    toggleFullscreen(secId);
                    e.preventDefault();
                }
                lastTapTime = currentTime;
            }, { passive: false });
        });

        // -------------------------------------------------------------
        // DÉTECTION DES COULEURS ET SYNCHRONISATION DU HTML
        // -------------------------------------------------------------

        function processColoredText(html) {
            const iframeDoc = renderHost.contentDocument || renderHost.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(html);
            iframeDoc.close();

            const body = iframeDoc.body || iframeDoc.documentElement;
            if (!body) return html;

            const defaultColor = window.getComputedStyle(body).color;
            const walker = iframeDoc.createTreeWalker(body, NodeFilter.SHOW_TEXT, null, false);
            const textNodesToProcess = [];

            let node;
            while (node = walker.nextNode()) {
                if (node.nodeValue.trim() !== '') {
                    const parent = node.parentElement;
                    if (parent) {
                        const computedColor = window.getComputedStyle(parent).color;
                        if (computedColor !== defaultColor && computedColor !== 'rgb(0, 0, 0)' && computedColor !== 'rgba(0, 0, 0, 0)') {
                            textNodesToProcess.push(node);
                        }
                    }
                }
            }

            textNodesToProcess.forEach(textNode => {
                const val = textNode.nodeValue;
                if (!val.startsWith('[[') || !val.endsWith(']]')) {
                    textNode.nodeValue = `[[${val}]]`;
                }
            });

            return body.innerHTML;
        }

        function updateProcessedView() {
            htmlProcessed.innerHTML = processColoredText(htmlSource.value);
        }

        htmlSource.addEventListener('input', () => {
            htmlVisual.innerHTML = htmlSource.value;
            updateProcessedView();
        });

        htmlVisual.addEventListener('input', () => {
            htmlSource.value = htmlVisual.innerHTML;
            updateProcessedView();
        });

        htmlProcessed.addEventListener('input', () => {
            htmlSource.value = htmlProcessed.innerHTML;
            htmlVisual.innerHTML = htmlProcessed.innerHTML;
        });

        // -------------------------------------------------------------
        // ACTIONS DE COPIE & NOTIFICATIONS
        // -------------------------------------------------------------

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function clearSourceHTML() {
            htmlSource.value = '';
            htmlVisual.innerHTML = '';
            htmlProcessed.innerHTML = '';
            showToast("Contenu vidé !");
        }

        function clearVisualHTML() {
            htmlVisual.innerHTML = '';
            htmlSource.value = '';
            htmlProcessed.innerHTML = '';
            showToast("Contenu vidé !");
        }

        function clearProcessedHTML() {
            htmlProcessed.innerHTML = '';
            htmlSource.value = '';
            htmlVisual.innerHTML = '';
            showToast("Contenu vidé !");
        }

        async function copySourceHTML() {
            try {
                await navigator.clipboard.writeText(htmlSource.value);
                showToast("Code HTML brut copié !");
            } catch (err) {
                console.error('Erreur de copie :', err);
            }
        }

        async function copyRichFromElement(element) {
            try {
                const range = document.createRange();
                range.selectNodeContents(element);
                
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);

                const htmlContent = `<div>${element.innerHTML}</div>`;
                const textContent = element.innerText;

                const blobHtml = new Blob([htmlContent], { type: 'text/html' });
                const blobText = new Blob([textContent], { type: 'text/plain' });

                const item = new ClipboardItem({
                    'text/html': blobHtml,
                    'text/plain': blobText
                });

                await navigator.clipboard.write([item]);
                selection.removeAllRanges();

                showToast("Texte riche copié !");
            } catch (err) {
                try {
                    document.execCommand('copy');
                    window.getSelection().removeAllRanges();
                    showToast("Texte riche copié !");
                } catch (fallbackErr) {
                    console.error('Erreur lors de la copie riche :', fallbackErr);
                }
            }
        }

        function copyRichText() {
            copyRichFromElement(htmlVisual);
        }

        function copyProcessedRichText() {
            copyRichFromElement(htmlProcessed);
        }
    </script>
</body>
</html>
