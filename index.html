<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éditeur & Prévisualisation HTML</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 15px;
            gap: 15px;
        }

        .section {
            display: flex;
            flex-direction: column;
            flex: 1;
            background: #ffffff;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Mode plein écran */
        .section.fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999 !important;
            border-radius: 0 !important;
            border: none !important;
            box-shadow: none !important;
        }

        .toolbar {
            background: #eef2f7;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #dcdfe6;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
        }

        .toolbar h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #4a5568;
            pointer-events: none;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #2b6cb0;
        }

        button.btn-clear {
            background-color: #e53e3e;
        }

        button.btn-clear:hover {
            background-color: #c53030;
        }

        button.btn-paste {
            background-color: #38a169;
        }

        button.btn-paste:hover {
            background-color: #2f855a;
        }

        button.btn-toggle-fs {
            background-color: #4a5568;
        }

        button.btn-toggle-fs:hover {
            background-color: #2d3748;
        }

        button:active {
            transform: scale(0.98);
        }

        textarea {
            width: 100%;
            height: 100%;
            border: none;
            padding: 15px;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
            background: #fafafa;
        }

        .wysiwyg {
            width: 100%;
            height: 100%;
            padding: 15px;
            overflow-y: auto;
            outline: none;
            background: #ffffff;
        }

        /* Troisième fenêtre : Texte entièrement noir, poids normal, pas d'italique */
        .wysiwyg-monochrome, 
        .wysiwyg-monochrome * {
            color: #000000 !important;
            font-weight: normal !important;
            font-style: normal !important;
            text-decoration: none !important;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2f855a;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 10000;
        }

        .toast.show {
            opacity: 1;
        }

        #renderHost {
            position: absolute;
            width: 0;
            height: 0;
            border: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <iframe id="renderHost"></iframe>

    <!-- Section 1 : Éditeur de code HTML -->
    <div class="section" id="section1">
        <div class="toolbar" id="tb1">
            <h2>Source HTML (Éditable)</h2>
            <div class="button-group">
                <button class="btn-clear" onclick="clearSourceHTML()">Vider</button>
                <button class="btn-paste" onclick="pasteToSourceHTML()">Coller</button>
                <button class="btn-toggle-fs" onclick="toggleFullscreen('section1')">Plein écran</button>
                <button onclick="copySourceHTML()">Copier le code HTML</button>
            </div>
        </div>
        <textarea id="htmlSource" placeholder="Saisissez ou collez votre code HTML ici..."></textarea>
    </div>

    <!-- Section 2 : Aperçu visuel éditable (WYSIWYG) -->
    <div class="section" id="section2">
        <div class="toolbar" id="tb2">
            <h2>Aperçu Visuel (Éditable)</h2>
            <div class="button-group">
                <button class="btn-clear" onclick="clearVisualHTML()">Vider</button>
                <button class="btn-toggle-fs" onclick="toggleFullscreen('section2')">Plein écran</button>
                <button onclick="copyRichText()">Copier le texte rendu (Riche)</button>
            </div>
        </div>
        <div id="htmlVisual" class="wysiwyg" contenteditable="true"></div>
    </div>

    <!-- Section 3 : Aperçu Monochrome avec texte coloré entre doubles crochets -->
    <div class="section" id="section3">
        <div class="toolbar" id="tb3">
            <h2>Aperçu Monochrome (Texte coloré entre doubles crochets)</h2>
            <div class="button-group">
                <button class="btn-clear" onclick="clearProcessedHTML()">Vider</button>
                <button class="btn-toggle-fs" onclick="toggleFullscreen('section3')">Plein écran</button>
                <button onclick="copyProcessedRichText()">Copier le texte rendu (Riche)</button>
            </div>
        </div>
        <div id="htmlProcessed" class="wysiwyg wysiwyg-monochrome" contenteditable="true"></div>
    </div>

    <div id="toast" class="toast">Action effectuée avec succès !</div>

    <script>
        const htmlSource = document.getElementById('htmlSource');
        const htmlVisual = document.getElementById('htmlVisual');
        const htmlProcessed = document.getElementById('htmlProcessed');
        const renderHost = document.getElementById('renderHost');
        const toast = document.getElementById('toast');

        // Exemple de contenu initial
        const initialContent = `<h3>Titre d'exemple</h3>\n<p>Ceci est un texte en <strong>gras</strong> et en <span style="color: red;">rouge</span>.</p>\n<ul>\n  <li>Élément 1</li>\n  <li>Élément en <font color="blue">bleu</font></li>\n</ul>`;
        htmlSource.value = initialContent;
        htmlVisual.innerHTML = initialContent;
        updateProcessedView();

        // -------------------------------------------------------------
        // FONCTION DE COLLAGE DÉDIÉE ET SYNCHRONISATION
        // -------------------------------------------------------------

        async function pasteToSourceHTML() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    htmlSource.value = text;
                    htmlVisual.innerHTML = text;
                    updateProcessedView();
                    showToast("Code HTML collé !");
                }
            } catch (err) {
                // Si l'accès au presse-papier direct est bloqué par le navigateur,
                // on donne le focus et on invite l'utilisateur à coller
                htmlSource.focus();
                showToast("Faites un appui long puis 'Coller'");
            }
        }

        // Écouteur natif d'événement "paste" sur le textarea
        htmlSource.addEventListener('paste', (e) => {
            setTimeout(() => {
                htmlVisual.innerHTML = htmlSource.value;
                updateProcessedView();
                showToast("Code HTML collé !");
            }, 50);
        });

        // -------------------------------------------------------------
        // GESTION DU PLEIN ÉCRAN & DOUBLE-TAP (CIBLÉ SUR LA BARRE D'OUTILS)
        // -------------------------------------------------------------
        
        function toggleFullscreen(sectionId) {
            const targetSection = document.getElementById(sectionId);
            const isFullscreen = targetSection.classList.contains('fullscreen');
            
            document.querySelectorAll('.section').forEach(sec => {
                sec.classList.remove('fullscreen');
                const btn = sec.querySelector('.btn-toggle-fs');
                if (btn) btn.textContent = 'Plein écran';
            });

            if (!isFullscreen) {
                targetSection.classList.add('fullscreen');
                const btn = targetSection.querySelector('.btn-toggle-fs');
                if (btn) btn.textContent = 'Réduire';
                showToast("Mode plein écran activé");
            }
        }

        // Touche Échap pour quitter le plein écran
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.section').forEach(sec => {
                    sec.classList.remove('fullscreen');
                    const btn = sec.querySelector('.btn-toggle-fs');
                    if (btn) btn.textContent = 'Plein écran';
                });
            }
        });

        // Application du double-tap/double-clic uniquement sur les en-têtes (toolbar)
        ['section1', 'section2', 'section3'].forEach(secId => {
            const section = document.getElementById(secId);
            const toolbar = section.querySelector('.toolbar');
            let lastTapTime = 0;

            // PC / MacOS
            toolbar.addEventListener('dblclick', (e) => {
                if (e.target.tagName !== 'BUTTON') {
                    toggleFullscreen(secId);
                }
            });

            // iOS / Tactile
            toolbar.addEventListener('touchend', (e) => {
                if (e.target.tagName === 'BUTTON') return;

                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;

                if (tapLength < 300 && tapLength > 0) {
                    toggleFullscreen(secId);
                    e.preventDefault();
                }
                lastTapTime = currentTime;
            }, { passive: false });
        });

        // -------------------------------------------------------------
        // DÉTECTION DES COULEURS ET SYNCHRONISATION DU HTML
        // -------------------------------------------------------------

        function processColoredText(html) {
            const iframeDoc = renderHost.contentDocument || renderHost.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(html);
            iframeDoc.close();

            const body = iframeDoc.body || iframeDoc.documentElement;
            if (!body) return html;

            const defaultColor = window.getComputedStyle(body).color;
            const walker = iframeDoc.createTreeWalker(body, NodeFilter.SHOW_TEXT, null, false);
            const textNodesToProcess = [];

            let node;
            while (node = walker.nextNode()) {
                if (node.nodeValue.trim() !== '') {
                    const parent = node.parentElement;
                    if (parent) {
                        const computedColor = window.getComputedStyle(parent).color;
                        if (computedColor !== defaultColor && computedColor !== 'rgb(0, 0, 0)' && computedColor !== 'rgba(0, 0, 0, 0)') {
                            textNodesToProcess.push(node);
                        }
                    }
                }
            }

            textNodesToProcess.forEach(textNode => {
                const val = textNode.nodeValue;
                if (!val.startsWith('[[') || !val.endsWith(']]')) {
                    textNode.nodeValue = `[[${val}]]`;
                }
            });

            return body.innerHTML;
        }

        function updateProcessedView() {
            htmlProcessed.innerHTML = processColoredText(htmlSource.value);
        }

        htmlSource.addEventListener('input', () => {
            htmlVisual.innerHTML = htmlSource.value;
            updateProcessedView();
        });

        htmlVisual.addEventListener('input', () => {
            htmlSource.value = htmlVisual.innerHTML;
            updateProcessedView();
        });

        htmlProcessed.addEventListener('input', () => {
            htmlSource.value = htmlProcessed.innerHTML;
            htmlVisual.innerHTML = htmlProcessed.innerHTML;
        });

        // -------------------------------------------------------------
        // ACTIONS DE COPIE & NOTIFICATIONS
        // -------------------------------------------------------------

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function clearSourceHTML() {
            htmlSource.value = '';
            htmlVisual.innerHTML = '';
            htmlProcessed.innerHTML = '';
            showToast("Contenu vidé !");
        }

        function clearVisualHTML() {
            htmlVisual.innerHTML = '';
            htmlSource.value = '';
            htmlProcessed.innerHTML = '';
            showToast("Contenu vidé !");
        }

        function clearProcessedHTML() {
            htmlProcessed.innerHTML = '';
            htmlSource.value = '';
            htmlVisual.innerHTML = '';
            showToast("Contenu vidé !");
        }

        async function copySourceHTML() {
            try {
                await navigator.clipboard.writeText(htmlSource.value);
                showToast("Code HTML brut copié !");
            } catch (err) {
                console.error('Erreur de copie :', err);
            }
        }

        async function copyRichFromElement(element) {
            try {
                const range = document.createRange();
                range.selectNodeContents(element);
                
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);

                const htmlContent = `<div>${element.innerHTML}</div>`;
                const textContent = element.innerText;

                const blobHtml = new Blob([htmlContent], { type: 'text/html' });
                const blobText = new Blob([textContent], { type: 'text/plain' });

                const item = new ClipboardItem({
                    'text/html': blobHtml,
                    'text/plain': blobText
                });

                await navigator.clipboard.write([item]);
                selection.removeAllRanges();

                showToast("Texte riche copié !");
            } catch (err) {
                try {
                    document.execCommand('copy');
                    window.getSelection().removeAllRanges();
                    showToast("Texte riche copié !");
                } catch (fallbackErr) {
                    console.error('Erreur lors de la copie riche :', fallbackErr);
                }
            }
        }

        function copyRichText() {
            copyRichFromElement(htmlVisual);
        }

        function copyProcessedRichText() {
            copyProcessedRichText();
        }
    </script>
</body>
</html>
