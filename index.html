<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éditeur & Prévisualisation HTML</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 15px;
            gap: 15px;
        }

        .section {
            display: flex;
            flex-direction: column;
            flex: 1;
            background: #ffffff;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .toolbar {
            background: #eef2f7;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #dcdfe6;
        }

        .toolbar h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #4a5568;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #2b6cb0;
        }

        button.btn-clear {
            background-color: #e53e3e;
        }

        button.btn-clear:hover {
            background-color: #c53030;
        }

        button:active {
            transform: scale(0.98);
        }

        textarea {
            width: 100%;
            height: 100%;
            border: none;
            padding: 15px;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
            background: #fafafa;
        }

        .wysiwyg {
            width: 100%;
            height: 100%;
            padding: 15px;
            overflow-y: auto;
            outline: none;
            background: #ffffff;
        }

        /* Troisième fenêtre : Texte entièrement noir, poids normal, pas d'italique */
        .wysiwyg-monochrome, 
        .wysiwyg-monochrome * {
            color: #000000 !important;
            font-weight: normal !important;
            font-style: normal !important;
            text-decoration: none !important;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2f855a;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Section 1 : Éditeur de code HTML -->
    <div class="section">
        <div class="toolbar">
            <h2>Source HTML (Éditable)</h2>
            <div class="button-group">
                <button class="btn-clear" onclick="clearSourceHTML()">Vider</button>
                <button onclick="copySourceHTML()">Copier le code HTML</button>
            </div>
        </div>
        <textarea id="htmlSource" placeholder="Saisissez ou collez votre code HTML ici..."></textarea>
    </div>

    <!-- Section 2 : Aperçu visuel éditable (WYSIWYG) -->
    <div class="section">
        <div class="toolbar">
            <h2>Aperçu Visuel (Éditable)</h2>
            <div class="button-group">
                <button class="btn-clear" onclick="clearVisualHTML()">Vider</button>
                <button onclick="copyRichText()">Copier le texte rendu (Riche)</button>
            </div>
        </div>
        <div id="htmlVisual" class="wysiwyg" contenteditable="true"></div>
    </div>

    <!-- Section 3 : Aperçu Monochrome avec texte coloré entre doubles crochets -->
    <div class="section">
        <div class="toolbar">
            <h2>Aperçu Monochrome (Texte coloré entre doubles crochets)</h2>
            <div class="button-group">
                <button class="btn-clear" onclick="clearProcessedHTML()">Vider</button>
                <button onclick="copyProcessedRichText()">Copier le texte rendu (Riche)</button>
            </div>
        </div>
        <div id="htmlProcessed" class="wysiwyg wysiwyg-monochrome" contenteditable="true"></div>
    </div>

    <div id="toast" class="toast">Action effectuée avec succès !</div>

    <script>
        const htmlSource = document.getElementById('htmlSource');
        const htmlVisual = document.getElementById('htmlVisual');
        const htmlProcessed = document.getElementById('htmlProcessed');
        const toast = document.getElementById('toast');

        // Exemple de contenu initial
        const initialContent = `<h3>Titre d'exemple</h3>\n<p>Ceci est un texte en <strong>gras</strong> et en <span style="color: red;">rouge</span>.</p>\n<ul>\n  <li>Élément 1</li>\n  <li>Élément en <font color="blue">bleu</font></li>\n</ul>`;
        htmlSource.value = initialContent;
        htmlVisual.innerHTML = initialContent;
        updateProcessedView();

        // Vérifie si un élément ou un de ses parents possède une couleur spécifique
        function hasColoredParentOrSelf(node) {
            let current = node.nodeType === Node.TEXT_NODE ? node.parentElement : node;
            while (current && current !== document.body) {
                // Balise <font color="...">
                if (current.tagName === 'FONT' && current.hasAttribute('color')) {
                    return true;
                }
                // Style inline `color:...`
                if (current.style && current.style.color) {
                    const c = current.style.color.toLowerCase().replace(/\s+/g, '');
                    if (c !== '' && c !== 'black' && c !== '#000' && c !== '#000000' && c !== 'rgb(0,0,0)') {
                        return true;
                    }
                }
                current = current.parentElement;
            }
            return false;
        }

        // Transforme le HTML pour insérer [[ ]] autour du texte qui était coloré
        function processColoredText(html) {
            const container = document.createElement('div');
            container.innerHTML = html;

            // Utilisation d'un TreeWalker pour isoler les nœuds de texte exacts
            const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
            const textNodesToProcess = [];

            let node;
            while (node = walker.nextNode()) {
                if (node.nodeValue.trim() !== '' && hasColoredParentOrSelf(node)) {
                    textNodesToProcess.push(node);
                }
            }

            textNodesToProcess.forEach(textNode => {
                const val = textNode.nodeValue;
                // Évite d'ajouter à nouveau des crochets si déjà présents
                if (!val.startsWith('[[') || !val.endsWith(']]')) {
                    textNode.nodeValue = `[[${val}]]`;
                }
            });

            return container.innerHTML;
        }

        // Mise à jour de la 3ème fenêtre
        function updateProcessedView() {
            htmlProcessed.innerHTML = processColoredText(htmlSource.value);
        }

        // Synchronisation : Code HTML -> Aperçu Visuel & Aperçu Monochrome
        htmlSource.addEventListener('input', () => {
            htmlVisual.innerHTML = htmlSource.value;
            updateProcessedView();
        });

        // Synchronisation : Aperçu Visuel -> Code HTML & Aperçu Monochrome
        htmlVisual.addEventListener('input', () => {
            htmlSource.value = htmlVisual.innerHTML;
            updateProcessedView();
        });

        // Synchronisation : Aperçu Monochrome -> Code HTML & Aperçu Visuel
        htmlProcessed.addEventListener('input', () => {
            htmlSource.value = htmlProcessed.innerHTML;
            htmlVisual.innerHTML = htmlProcessed.innerHTML;
        });

        // Notification visuelle
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Boutons pour vider le contenu
        function clearSourceHTML() {
            htmlSource.value = '';
            htmlVisual.innerHTML = '';
            htmlProcessed.innerHTML = '';
            showToast("Contenu vidé !");
        }

        function clearVisualHTML() {
            htmlVisual.innerHTML = '';
            htmlSource.value = '';
            htmlProcessed.innerHTML = '';
            showToast("Contenu vidé !");
        }

        function clearProcessedHTML() {
            htmlProcessed.innerHTML = '';
            htmlSource.value = '';
            htmlVisual.innerHTML = '';
            showToast("Contenu vidé !");
        }

        // Bouton 1 : Copie le code brut (HTML)
        async function copySourceHTML() {
            try {
                await navigator.clipboard.writeText(htmlSource.value);
                showToast("Code HTML brut copié !");
            } catch (err) {
                console.error('Erreur de copie :', err);
            }
        }

        // Fonction générique pour copier le texte riche d'un élément DOM
        async function copyRichFromElement(element) {
            try {
                const range = document.createRange();
                range.selectNodeContents(element);
                
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);

                const htmlContent = `<div>${element.innerHTML}</div>`;
                const textContent = element.innerText;

                const blobHtml = new Blob([htmlContent], { type: 'text/html' });
                const blobText = new Blob([textContent], { type: 'text/plain' });

                const item = new ClipboardItem({
                    'text/html': blobHtml,
                    'text/plain': blobText
                });

                await navigator.clipboard.write([item]);
                selection.removeAllRanges();

                showToast("Texte riche copié !");
            } catch (err) {
                try {
                    document.execCommand('copy');
                    window.getSelection().removeAllRanges();
                    showToast("Texte riche copié !");
                } catch (fallbackErr) {
                    console.error('Erreur lors de la copie riche :', fallbackErr);
                }
            }
        }

        // Bouton 2 : Copie le rendu de la deuxième fenêtre
        function copyRichText() {
            copyRichFromElement(htmlVisual);
        }

        // Bouton 3 : Copie le rendu de la troisième fenêtre (Monochrome, normal avec doubles crochets)
        function copyProcessedRichText() {
            copyRichFromElement(htmlProcessed);
        }
    </script>
</body>
</html>
